########################## About ##############################
about:
  enable: true
  title: "Ljubezen, ki je zrasla iz znanosti"
  content:
    "ZoLi se je rodila iz ljubezni. Do naravnega, do čistosti in do znanosti, ki stoji za
    vsakodnevno nego.<br>
    Za ZoLi stojiva:
    <ul>
    <li>Barbara, magistrica kemijskega inženirstva, in</li>
    <li>Gorazd, doktor biokemije,</li>
    </ul>
    ki sva svoje življenje posvetila razumevanju molekul — tistih drobnih delcev, iz katerih
    nastajata lepota in zdravje. Med delom v velikih farmacevtskih podjetjih sva spoznala moč
    vrhunske formulacije, a tudi njene meje. Tako se je rodila želja po nečem bolj pristnem –
    po kozmetiki, ki ne skriva narave za bleščečimi embalažami, temveč jo spoštuje in oživi."
  image: "images/stojnica-1.jpg"

about2:
  enable: true
  title: "Od laboratorija do domače kopalnice"
  content:
    "Ona skrbi, da vsak izdelek ne navduši le s svojo teksturo in vonjem, temveč tudi z
    varnostjo, učinkovitostjo in znanstveno korektnostjo. On je mojster ravnovesja.
    Natančno izbira naravna olja, masla in izvlečke ter jih združuje v popolno sinergijo.
    Skupaj ustvarjava formulacije, ki so čiste, preproste in presenetljivo učinkovite.
    Vsak kos mila, vsaka steklenička šampona je rezultat te redke povezanosti — moči narave in
    natančnosti znanosti."
  image: "images/from_lab_to_bathroom.png"

