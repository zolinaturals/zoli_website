############################ banner ##########################
banner:
  enable: true
  title: "ZoLi: Kjer znanost sreča naravo"
  content:
    "Narava s poklicem. Zgodba, ki jo pozna vsaka kapljica. V svetu industrijsko izdelane
    kozmetike smo se navadili na popolnost brez pristnosti — na teksture, ki obljubljajo več,
    kot resnično dajo. A vaše telo si zasluži več. Resnično nego, ki spoštuje njeno naravo."
  image:
    path: "images/banner_w600.png"
    height_px: 320
  button:
    enable: true
    label: "Produkti"
    link: "products/"
  # demo video
  video:
    enable: false
    videoURL: "https://youtu.be/evlTDfam5X8?si=nMcq0HTDN9pVxGk5"

########################## About ##############################
about:
  enable: true
  title: "Od laboratorija do domače kopalnice"
  content:
    "Ona skrbi, da vsak izdelek ne navduši le s svojo teksturo in vonjem, temveč tudi z
    varnostjo, učinkovitostjo in znanstveno korektnostjo. On je mojster ravnovesja.
    Natančno izbira naravna olja, masla in izvlečke ter jih združuje v popolno sinergijo.
    Skupaj ustvarjava formulacije, ki so čiste, preproste in presenetljivo učinkovite.
    Vsak kos mila, vsaka steklenička šampona je rezultat te redke povezanosti — moči narave in
    natančnosti znanosti."
  image: "images/from_lab_to_bathroom.png"

###################### Call to action ########################
cta:
  enable: true
  title: "Ljubezen, ki je zrasla iz znanosti"
  content: "ZoLi se je rodila iz ljubezni do naravnega, do čistosti, in do znanosti."
  # image: "images/cta.png"
  image: "images/banner 2.png"
  overlayImage: "images/cta-overlay.png"
  button:
    label: "Poglej produkte"
    link: "products/"

######################## raw material #######################
material:
  enable: false
  title: "Sestavine v naših produktih"
  subtitle: "Nasi produkti so izdelani le iz najboljših sestavin. Pri izbiri
    smo nadvse natančni iz izbirčni. Ce ni domače ali vsaj proizvedeno
    po visokih bio standardih za nas preslabo. Lahko ste brez skrbi Narava je
    nase vodilo."
  materialItem:
    # material item loop
    - title: "Marihuana Seeds"
      image: "images/material/material-1.png"
      content: "Semena marihuane blagodejno vplavajo na kalitev. Nespolno
        razmnoževanje pri rastlinah dokazano povecuje ambicioznost pri ljudeh,
        ki taksna semena uživajo. Mnogi strokovnjaki, tudi Herta, o tem veliko
        govorijo."

    # material item loop
    - title: "Aloe Vera"
      image: "images/material/material-2.png"
      content: "Te je picik komar??? Ni tezav. Aloe Vera priskoci na pomoc.
        Gel pridobljen iz listov aloevera ima neverjetne hladilne ucinke. Na
        IJS so celo pokazali, da so primerljivi z delovanjem tekocega dusika."

    # material item loop
    - title: "Te-tri olje"
      image: "images/material/material-3.png"
      content: "Brez besed, to je cudezno zdravilo. Malo namazi na vrat in takoj
        si zdrav."

    # material item loop
    - title: "Zdrava sol"
      image: "images/material/material-4.png"
      content: "Sol iz himalajskih visokogorskih rudnikov, ki uspeva v pogojih
        nizke vsebnosti kisika, vsebuje neprecenljive minerala. Ker pa za nase
        produkte ni dovolj popolnost, smo se odlocili za se izboljsano verzijo
        iz Tuzle.... zdravje zagotovljeno, samo odprite denarnico."

